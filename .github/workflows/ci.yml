name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  dogfood:
    # The action run on itself: record vos.so's own CLI page, deliver the
    # store set, verify it, and (on a pull request) keep the comment. No key
    # in this repo yet; with the VOS_API_KEY secret every run versions the
    # tracked vos in test/vos.json (the dogfood take on the vos.so shelf).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ./
        with:
          actions: test/actions.json
          doc: ''
          channels: cws,og
          release: ci-${{ github.run_number }}
          tracking: test/vos.json
