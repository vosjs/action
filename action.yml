name: vos release media
description: >-
  Record the real product in CI, cut the release's videos from it (the README
  loop, the feed and vertical cuts, the demo), verify every cut against its
  channel spec, push the take to vos.so, and keep one comment on the pull
  request with the watch page and the kit. The next release is a re-render,
  not a re-shoot.
author: vosso
branding:
  icon: film
  color: red

inputs:
  actions:
    description: The click script that records the product (vos record --actions).
    default: media/actions.json
  doc:
    description: The committed cut to carry onto the new footage (vos plan --reuse --from). Skipped when absent.
    default: media/doc.json
  channels:
    description: The channel set vos deliver renders (youtube,x,shorts-linkedin,github or all).
    default: github
  release:
    description: The release name stamped on the kit and the push label. Defaults to the tag, or pr-<number>.
    default: ''
  key:
    description: A vos.so content key (VOS_API_KEY). Without one the take is not pushed; the kit and the comment still land.
    default: ''
  tracking:
    description: The committed vos.json that says which vos the pushes version. Optional.
    default: media/vos.json
  comment:
    description: Keep one sticky comment on the pull request (needs pull-requests write).
    default: 'true'
  take:
    description: Where the take is recorded.
    default: ${{ runner.temp }}/take
  cli:
    description: >-
      The @vosjs/cli version this action runs. Pinned, because an unpinned
      install runs whatever npm served that minute, with the job's token and
      your key; moved by the action's own releases.
    default: '0.75.1'

outputs:
  kit:
    description: The kit directory.
    value: ${{ steps.deliver.outputs.kit }}
  vos-id:
    description: The vos the take was pushed to (empty without a key).
    value: ${{ steps.push.outputs.vos-id }}
  version:
    description: The version number the push created (empty without a key).
    value: ${{ steps.push.outputs.version }}
  watch-url:
    description: The watch page (empty without a key).
    value: ${{ steps.push.outputs.watch-url }}

# Every input reaches a shell through `env`, never spliced into the script:
# an input is whatever the calling workflow put there, and a `${{ }}` inside
# `run` is substituted before the shell parses it.
runs:
  using: composite
  steps:
    - name: name the release
      id: name
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.number }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -n "$RELEASE" ]; then echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
        elif [ "$EVENT" = "pull_request" ]; then echo "release=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
        else echo "release=$REF_NAME" >> "$GITHUB_OUTPUT"; fi

    - name: install the vos CLI
      shell: bash
      env:
        CLI: ${{ inputs.cli }}
      run: |
        case "$CLI" in
          *[!0-9.]*|'') echo "::error::cli must be an exact version, got '$CLI'"; exit 1 ;;
        esac
        npm i -g "@vosjs/cli@$CLI"

    - name: record the product
      shell: bash
      env:
        ACTIONS: ${{ inputs.actions }}
        TAKE: ${{ inputs.take }}
      run: vos record --actions "$ACTIONS" --out "$TAKE" --strict --json

    - name: carry the committed cut onto the new footage
      if: hashFiles(inputs.doc) != ''
      shell: bash
      env:
        DOC: ${{ inputs.doc }}
        TAKE: ${{ inputs.take }}
      run: vos plan "$TAKE" --reuse --from "$DOC" --json

    - name: render the destination set
      id: deliver
      shell: bash
      env:
        TAKE: ${{ inputs.take }}
        CHANNELS: ${{ inputs.channels }}
        RELEASE: ${{ steps.name.outputs.release }}
      run: |
        vos deliver "$TAKE" --to "$CHANNELS" --release "$RELEASE" --json | tee "$RUNNER_TEMP/deliver.ndjson"
        echo "kit=$TAKE/kit" >> "$GITHUB_OUTPUT"

    - name: re-measure the kit from its bytes
      id: validate
      shell: bash
      env:
        TAKE: ${{ inputs.take }}
      run: |
        set +e
        vos validate "$TAKE/kit/kit.json" --json | tee "$RUNNER_TEMP/validate.ndjson"
        echo "status=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: push the take, labelled for the release
      id: push
      if: inputs.key != ''
      shell: bash
      env:
        VOS_API_KEY: ${{ inputs.key }}
        TAKE: ${{ inputs.take }}
        TRACKING: ${{ inputs.tracking }}
        RELEASE: ${{ steps.name.outputs.release }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -f "$TRACKING" ]; then cp "$TRACKING" "$TAKE/vos.json"; fi
        vos push "$TAKE" --label "$RELEASE launch" --note "Release media from $REPO ($EVENT $SHA)" --yes --json | tee "$RUNNER_TEMP/push.ndjson"
        node "$ACTION_PATH/scripts/outputs.mjs" "$RUNNER_TEMP/push.ndjson" >> "$GITHUB_OUTPUT"
        # The push moved the base: the take's vos.json now names the version
        # it created. Write it back to the tracking path so the workflow can
        # commit it, or the next push is refused as a stale base.
        if [ -n "$TRACKING" ] && [ -f "$TAKE/vos.json" ]; then
          mkdir -p "$(dirname "$TRACKING")"
          cp "$TAKE/vos.json" "$TRACKING"
        fi

    - name: attach the kit
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-kit-${{ steps.name.outputs.release }}
        path: ${{ inputs.take }}/kit

    - name: keep one comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE: ${{ steps.name.outputs.release }}
        KIT: ${{ inputs.take }}/kit/kit.json
        PUSH: ${{ runner.temp }}/push.ndjson
        VALIDATE: ${{ runner.temp }}/validate.ndjson
        REPO: ${{ github.repository }}
        PR: ${{ github.event.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ARTIFACT: release-kit-${{ steps.name.outputs.release }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/comment.mjs"

    - name: the kit failed its own verifier
      if: steps.validate.outputs.status != '0'
      shell: bash
      run: |
        echo "vos validate found problems in the kit (see the step above and the comment)."
        exit 1
